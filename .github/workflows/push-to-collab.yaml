name: Automatic synchronization of ongoing work with collaboration repository

on:
  push:
    branches:
      - main

concurrency:
  group: sync-main-to-collab
  cancel-in-progress: true

jobs:
  sync-to-collab-repo:
    runs-on: ubuntu-latest
    env:
      TARGET_REPOSITORY: imcs-compsim/collab-ansys-ml4contact
      SYNC_BRANCH: sync/main

    steps:
      - name: Checkout source repo (this one)
        uses: imcs-compsim/checkout@v3
        with:
          fetch-depth: 0
          ref: main

      - name: Clone the collaboration repository
        env:
          COLLAB_PUSH_TOKEN: ${{ secrets.COLLAB_PUSH_TOKEN }}
        run: |
          git clone "https://x-access-token:${COLLAB_PUSH_TOKEN}@github.com/${TARGET_REPOSITORY}.git" ../collab-repo

      - name: Create synchronization branch from target main
        working-directory: ../collab-repo
        run: git checkout -B "${SYNC_BRANCH}" origin/main

      - name: Rsync selected folders into collaboration repo
        run: |
          rsync -av --delete compsim_pinns/ ../collab-repo/compsim_pinns/
          rsync -av --delete pyproject.toml ../collab-repo/
          rsync -av --delete __version__.py ../collab-repo/
          rsync -av --delete env.yaml ../collab-repo/
        # `--delete` ensures removed files are also deleted in the target

      - name: Commit and push synchronization branch
        id: sync
        working-directory: ../collab-repo
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"

          git add --all
          if ! git diff --cached --quiet; then
            git commit -m "Sync from ${GITHUB_REPOSITORY}@${GITHUB_SHA}"
            git push --force-with-lease origin "HEAD:refs/heads/${SYNC_BRANCH}"
            echo "changes=true" >> "${GITHUB_OUTPUT}"
          else
            echo "No changes to commit"
            echo "changes=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Open pull request in collaboration repository
        if: steps.sync.outputs.changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.COLLAB_PUSH_TOKEN }}
        run: |
          if [[ "$(gh pr list \
            --repo "${TARGET_REPOSITORY}" \
            --head "${SYNC_BRANCH}" \
            --base main \
            --state open \
            --json number \
            --jq 'length')" == "0" ]]; then
            gh pr create \
              --repo "${TARGET_REPOSITORY}" \
              --head "${SYNC_BRANCH}" \
              --base main \
              --title "Sync changes from ${GITHUB_REPOSITORY}" \
              --body "Automated synchronization from ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/tree/main. New source commits update this pull request."
          else
            echo "An open synchronization pull request already exists"
          fi
